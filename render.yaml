services:
  - type: web
    name: cx-reply-assistant
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm --prefix backend ci --include=dev && npm --prefix backend run build && npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    startCommand: node backend/dist/scripts/init-db.js && node backend/dist/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Supabase Session Pooler URI; keep on the server only
      - key: PGSSL
        value: "true"
      - key: PGPOOL_MAX
        value: "5"
      - key: AUTH_ENABLED
        value: "true"
      - key: AUTH_SECRET
        generateValue: true
      - key: ALLOW_DEV_FALLBACK
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: AI_TIMEOUT_MS
        value: "30000"
